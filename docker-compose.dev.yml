services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${SERVER_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      SERVER_PORT: ${SERVER_PORT}
      DATABASE_URL: ${DATABASE_URL}
    command: npm run start:dev
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.SERVER_PORT + '/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: ${CLIENT_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL}
    command: npm run dev -- --host 0.0.0.0 --port ${CLIENT_PORT}
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.CLIENT_PORT).then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  prisma-studio:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${PRISMA_STUDIO_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: npm run prisma:studio -- --port ${PRISMA_STUDIO_PORT}
    ports:
      - "${PRISMA_STUDIO_PORT}:${PRISMA_STUDIO_PORT}"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

