services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: ${SERVER_CONTAINER_NAME}
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVER_PORT: ${SERVER_PORT}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.SERVER_PORT + '/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: ${CLIENT_CONTAINER_NAME}
    restart: always
    ports:
      - "${CLIENT_PORT}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network
